<!doctype html>
<html lang="zh-CN" data-theme="forge">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GymCoach Admin · 登录概念</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text-1);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    input { font-size: 16px; }
    .num { font-variant-numeric: tabular-nums; }
    .login {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(420px, .75fr);
      min-height: 100dvh;
    }
    .brand-side {
      position: relative;
      display: flex;
      overflow: hidden;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--line);
      padding: var(--sp-8);
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        var(--sidebar);
      background-size: 56px 56px;
    }
    .brand-side::after {
      position: absolute;
      right: -150px;
      bottom: -180px;
      width: 540px;
      height: 540px;
      border: 42px solid var(--accent-soft);
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px var(--line), 0 0 0 1px var(--line);
      content: "";
      opacity: .62;
      animation: plate 28s linear infinite;
    }
    .top-brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      font-weight: var(--fw-strong);
    }
    .mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: var(--r-sm);
      background: var(--accent);
      color: var(--accent-ink);
      transform: skew(-7deg);
    }
    .hero { position: relative; z-index: 1; max-width: 720px; }
    .eyebrow {
      margin-bottom: var(--sp-4);
      color: var(--accent-text);
      font-size: var(--fs-label);
      font-weight: var(--fw-strong);
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 9ch;
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(54px, 7vw, 104px);
      font-weight: var(--fw-strong);
      letter-spacing: -.06em;
      line-height: .88;
    }
    .lead { max-width: 42ch; margin: var(--sp-6) 0 0; color: var(--text-2); font-size: var(--fs-title); line-height: 1.6; }
    .signal {
      position: relative;
      z-index: 1;
      display: flex;
      gap: var(--sp-6);
      color: var(--text-3);
      font-size: var(--fs-meta);
    }
    .signal span { display: flex; align-items: center; gap: var(--sp-2); }
    .signal i { width: 6px; height: 6px; border-radius: 50%; background: var(--done); }
    .form-side {
      display: grid;
      place-items: center;
      padding: var(--sp-8);
      background: var(--surface);
    }
    .form-wrap { width: min(380px, 100%); animation: enter var(--dur-move) var(--ease-out) both; }
    .form-kicker { color: var(--accent-text); font-size: var(--fs-label); font-weight: var(--fw-strong); letter-spacing: .1em; text-transform: uppercase; }
    h2 { margin: var(--sp-2) 0 0; font-size: 28px; letter-spacing: -.03em; }
    .form-sub { margin: var(--sp-2) 0 var(--sp-8); color: var(--text-2); font-size: var(--fs-meta); }
    .field { display: grid; gap: var(--sp-2); margin-top: var(--sp-4); }
    .field label { color: var(--text-2); font-size: var(--fs-meta); }
    .field input {
      height: 46px;
      border: 1px solid var(--line-strong);
      border-radius: var(--r-md);
      outline: 0;
      background: var(--surface-2);
      padding: 0 var(--sp-3);
      color: var(--text-1);
      transition: opacity var(--dur-state) var(--ease-out);
    }
    .field input:focus { border-color: var(--accent); }
    .form-meta { display: flex; justify-content: space-between; margin: var(--sp-4) 0 var(--sp-6); color: var(--text-2); font-size: var(--fs-meta); }
    .form-meta a { color: var(--accent-text); text-decoration: none; }
    .primary {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: var(--r-md);
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer;
      font-weight: var(--fw-strong);
      transition: transform var(--dur-press) var(--ease-out), opacity var(--dur-state) var(--ease-out);
    }
    .primary:active { transform: scale(.985); }
    .security { margin-top: var(--sp-5); color: var(--text-3); font-size: var(--fs-label); line-height: 1.6; text-align: center; }
    @keyframes enter {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes plate {
      to { transform: rotate(360deg); }
    }
    @media (hover: hover) and (pointer: fine) {
      .primary:hover { opacity: .88; }
      .form-meta a:hover { opacity: .75; }
    }
    @media (max-width: 840px) {
      body { overflow: auto; }
      .login { grid-template-columns: 1fr; }
      .brand-side { min-height: 42dvh; padding: var(--sp-6); }
      .hero { margin: var(--sp-8) 0; }
      h1 { font-size: 48px; }
      .lead, .signal { display: none; }
      .form-side { min-height: 58dvh; padding: var(--sp-6); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="login">
    <section class="brand-side">
      <div class="top-brand"><span class="mark">GC</span><span>GymCoach · Asset OS</span></div>
      <div class="hero">
        <div class="eyebrow">Content Engineering Console</div>
        <h1>把每个动作，打磨成标准资产。</h1>
        <p class="lead">管理动作 SKU、多模态素材、训练教案与 AI 反馈，让每一次内容更新即时抵达训练现场。</p>
      </div>
      <div class="signal"><span><i></i>API 正常</span><span><i></i>媒体流水线在线</span><span class="num">v0.9.2</span></div>
    </section>
    <section class="form-side">
      <form class="form-wrap">
        <div class="form-kicker">Authorized Access</div>
        <h2>进入工作台</h2>
        <p class="form-sub">仅限 GymCoach 内容与运营成员</p>
        <div class="field"><label for="account">账号</label><input id="account" autocomplete="username" placeholder="name@gymcoach.local" /></div>
        <div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" placeholder="输入密码" /></div>
        <div class="form-meta"><span>保持登录 7 天</span><a href="#">无法登录？</a></div>
        <button class="primary" type="button">安全登录 →</button>
        <div class="security">登录行为将记录到审计日志<br />生产环境建议启用 TOTP 二次验证</div>
      </form>
    </section>
  </main>
</body>
</html>
